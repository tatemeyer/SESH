# SESH's gate, run by a machine instead of by hand.
#
# These are the same five commands CLAUDE.md requires green before any commit,
# in the same order, with no additions. If this file and that list ever
# disagree, that list is the specification and this file is the bug.
#
# Split into two jobs because they share nothing and can run at once; both must
# pass, so the gate is still all-five-or-nothing.
#
# What this cannot do: SESH is built and run on a Raspberry Pi 5 (aarch64) and
# these runners are x86_64. CI proves the suite is green, never that the room
# works. Every arc still closes on hardware.
name: gate

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: cargo test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The runner image already ships a stable toolchain; these two components
      # are what `-D warnings` and `--check` need and are not installed by
      # default. Stable matches the Pi, which is on 1.97 against an MSRV of 1.82.
      - name: Add clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  surfaces:
    name: npm test, npm run build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surfaces
    steps:
      - uses: actions/checkout@v5

      # Node 20 is what the Pi runs. This pins the *project's* Node, which is
      # unrelated to the Node the actions themselves execute on — the v5 tags
      # above are what keep that off a runtime GitHub is retiring.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: surfaces/package-lock.json

      # `ci` rather than `install`: it installs exactly the committed lockfile,
      # which is what "dependencies are pinned" means here.
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The one name branch protection requires.
  #
  # Requiring `rust` and `surfaces` directly would work today and break the
  # moment either gains a path filter: a docs-only PR would skip the job, the
  # required check would never report, and the PR would wait forever with no
  # error to read. That is Parallax #43. So the rule is never require a job that
  # can be filtered — require an aggregator that always runs.
  #
  # `if: always()` is what makes it always report. It fails only on a real
  # failure: a skipped dependency is not a failure, it is a job that correctly
  # had nothing to do.
  gate:
    name: gate
    if: always()
    needs: [rust, surfaces]
    runs-on: ubuntu-latest
    steps:
      - name: Both halves must have passed
        env:
          RUST: ${{ needs.rust.result }}
          SURFACES: ${{ needs.surfaces.result }}
        run: |
          echo "rust=$RUST surfaces=$SURFACES"
          for result in "$RUST" "$SURFACES"; do
              case "$result" in
                  success|skipped) ;;
                  *) echo "::error::a half of the gate did not pass"; exit 1 ;;
              esac
          done
          echo "gate green"
