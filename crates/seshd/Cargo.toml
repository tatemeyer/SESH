[package]
name = "seshd"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
anyhow = "1"
# Object-safe `async fn` in a trait, which stable Rust still does not provide.
# `Arc<dyn Player>` is required so the queue logic can be driven by a mock with
# no network; without this the seam would have to be an enum or a boxed future.
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
# Join codes and phone tokens need cryptographic randomness. `getrandom` is the
# OS entropy syscall and nothing more; it is already in the tree transitively,
# so depending on it directly adds no compiled code. `rand` would pull a whole
# PRNG and distributions stack to fill sixteen bytes.
getrandom = "0.2"
# The TV renders the join QR itself. A JS QR library would be the first runtime
# dependency in a deliberately framework-free surface, and the kiosk has no CDN.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Spotify Web API calls. `rustls-tls` rather than the default native-tls so the
# Pi does not need an OpenSSL toolchain, and `default-features = false` keeps
# the unused ones out. Shares hyper 1.x with axum rather than adding a stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3"
# A feature on a crate already depended on, not a new dependency. `test-util`
# gives paused time, without which the loops here cannot be tested at all: the
# audio watch ticks every 5s and the presence sweep every 60s, so a real-time
# test is either minutes long or absent. It was absent, which is how a failed
# `pactl` came to be reported as the speaker leaving the room.
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = "0.21"
tower = { version = "0.4", features = ["util"] }
